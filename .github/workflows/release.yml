name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tag and build
        shell: bash
        run: |
          expected="v$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match project version $expected" >&2
            exit 1
          }
          chmod +x gradlew
          pwsh ./build-all.ps1
          cd build/libs
          sha256sum correct-chat-mc*.jar > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          build/libs/correct-chat-*.jar
          build/libs/SHA256SUMS.txt
          --title "Correct Chat ${GITHUB_REF_NAME#v}"
          --generate-notes

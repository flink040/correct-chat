buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${project.loom_version}"
    }
}

apply plugin: providers.gradleProperty('minecraft_target').get() == '1.21.11'
        ? 'net.fabricmc.fabric-loom-remap'
        : 'net.fabricmc.fabric-loom'
apply plugin: 'maven-publish'

def supportedTargets = [
        '26.2': [minecraft: '26.2', fabricApi: '0.160.0+26.2', modMenu: '20.0.3', java: 25, legacy: false],
        '26.1': [minecraft: '26.1', fabricApi: '0.145.1+26.1', modMenu: '18.0.1', java: 25, legacy: false],
        '1.21.11': [minecraft: '1.21.11', fabricApi: '0.141.6+1.21.11', modMenu: '17.0.1', java: 21, legacy: true]
]
def targetName = providers.gradleProperty('minecraft_target').get()
def target = supportedTargets[targetName]
if (target == null) {
    throw new GradleException("Unsupported Minecraft target '${targetName}'. Supported targets: ${supportedTargets.keySet().join(', ')}")
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-mc${targetName}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        correctchat {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${target.minecraft}"
    if (target.legacy) {
        mappings loom.officialMojangMappings()
    }
    if (target.legacy) {
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        modImplementation "com.terraformersmc:modmenu:${target.modMenu}"
    } else {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        implementation "com.terraformersmc:modmenu:${target.modMenu}"
    }
    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    include implementation("com.googlecode.soundlibs:mp3spi:1.9.5.4")
    include implementation("com.googlecode.soundlibs:vorbisspi:1.0.3.3")
    include implementation("com.googlecode.soundlibs:jlayer:1.0.1.4")
    include implementation("com.googlecode.soundlibs:jorbis:0.0.17.4")
    include implementation("com.googlecode.soundlibs:tritonus-share:0.3.7.4")
}

def generatedClientSources = layout.buildDirectory.dir('generated/sources/versionedClient/java')
def prepareVersionedClientSources = tasks.register('prepareVersionedClientSources', Sync) {
    inputs.property 'minecraft_target', targetName
    from('src/client/java')
    into(generatedClientSources)
    filteringCharset = 'UTF-8'
    filesMatching('**/*.java') {
        filter { line ->
            if (targetName == '26.2') return line
            line = line
                    .replace('.gui.hud.getChat()', '.gui.getChat()')
                    .replace('client.gui == null || client.gui.hud == null', 'client.gui == null')
                    .replace('.gui.setScreen(', '.setScreen(')
                    .replace('.gui.screen()', '.screen')
            if (!target.legacy) return line
            line
                    .replace('net.minecraft.client.gui.GuiGraphicsExtractor', 'net.minecraft.client.gui.GuiGraphics')
                    .replace('GuiGraphicsExtractor', 'GuiGraphics')
                    .replace('"extractRenderState"', '"render"')
                    .replace('extractRenderState(', 'render(')
                    .replace('super.extractRenderState(', 'super.render(')
                    .replace('graphics.centeredText(', 'graphics.drawCenteredString(')
                    .replace('graphics.text(', 'graphics.drawString(')
                    .replace('g.centeredText(', 'g.drawCenteredString(')
                    .replace('g.text(', 'g.drawString(')
                    .replace('.horizontalLine(', '.hLine(')
                    .replace('.verticalLine(', '.vLine(')
                    .replace('net.fabricmc.fabric.api.client.command.v2.ClientCommands', 'net.fabricmc.fabric.api.client.command.v2.ClientCommandManager')
                    .replace('ClientCommands.', 'ClientCommandManager.')
                    .replace('net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper', 'net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper')
                    .replace('KeyMappingHelper', 'KeyBindingHelper')
                    .replace('registerKeyMapping(', 'registerKeyBinding(')
                    .replace('net.minecraft.client.multiplayer.chat.GuiMessage', 'net.minecraft.client.GuiMessage')
                    .replace('.addClientSystemMessage(', '.addMessage(')
                    .replace('extractContents(', 'renderContents(')
        }
    }
}

sourceSets.client.java.setSrcDirs([
        generatedClientSources,
        target.legacy ? 'src/compatLegacy/java' : 'src/compat26_2/java'
])
tasks.named('compileClientJava') {
    dependsOn prepareVersionedClientSources
}

sourceSets {
    test {
        compileClasspath += sourceSets.client.output
        runtimeClasspath += sourceSets.client.output
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar') {
    manifest {
        attributes(
                'Implementation-Title': 'Correct Chat',
                'Implementation-Version': project.version
        )
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dependency', targetName == '26.1' ? '~26.1' : "~${target.minecraft}"
    inputs.property 'java_dependency', target.java
    inputs.property 'fabric_api_dependency', target.fabricApi
    inputs.property 'mixin_config', target.legacy ? 'correctchat.client.legacy.mixins.json' : 'correctchat.client.mixins.json'
    inputs.property 'modmenu_dependency', ">=${target.modMenu.tokenize('.')[0]}.0.0"
    filesMatching('fabric.mod.json') {
        expand inputs.properties
    }
    from('THIRD_PARTY_NOTICE.md') {
        into 'META-INF'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = target.java
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(target.java)
    targetCompatibility = JavaVersion.toVersion(target.java)
}

tasks.named('sourcesJar') {
    dependsOn prepareVersionedClientSources
}

def releaseVersion = project.version.toString()
def releaseArchiveBaseName = "${project.archives_base_name}-mc${targetName}"

tasks.register('verifyReleaseNotices') {
    dependsOn tasks.named('jar'), tasks.named('sourcesJar')
    doLast {
        def releaseJar = tasks.named('jar').get().archiveFile.get().asFile
        def entries = zipTree(releaseJar).files.collect { it.path.replace('\\', '/') }
        [
                'fabric.mod.json',
                'correctchat.client.mixins.json',
                'assets/correctchat/icon.png',
                'assets/correctchat/lang/de_de.json',
                'assets/correctchat/lang/en_us.json',
                'META-INF/THIRD_PARTY_NOTICE.md',
                'META-INF/LICENSES/LGPL-2.1.txt'
        ].each { required ->
            if (!entries.any { it.endsWith('/' + required) }) {
                throw new GradleException("Release JAR is missing ${required}")
            }
        }
        ['correct-chat.json', 'correct-chat.json.bak', 'reverse-engineered', '.diagnostics'].each { forbidden ->
            if (entries.any { it.endsWith('/' + forbidden) }) {
                throw new GradleException("Release JAR must not contain ${forbidden}")
            }
        }
        def metadata = zipTree(releaseJar).matching { include 'fabric.mod.json' }.singleFile.text
        if (metadata.contains('${version}')) {
            throw new GradleException('Release JAR contains unexpanded version metadata')
        }
        def parsedMetadata = new groovy.json.JsonSlurper().parseText(metadata)
        if (parsedMetadata.version != releaseVersion) {
            throw new GradleException("fabric.mod.json version ${parsedMetadata.version} does not match ${releaseVersion}")
        }
        def manifestVersion = new java.util.jar.JarFile(releaseJar).withCloseable {
            it.manifest.mainAttributes.getValue('Implementation-Version')
        }
        if (manifestVersion != releaseVersion) {
            throw new GradleException("Manifest version ${manifestVersion} does not match ${releaseVersion}")
        }

        def expectedJarName = "${releaseArchiveBaseName}-${releaseVersion}.jar"
        ['README.md', 'ANLEITUNG.md'].each { document ->
            if (!file(document).text.contains(expectedJarName)) {
                throw new GradleException("${document} does not reference ${expectedJarName}")
            }
        }
        if (!file('CHANGELOG.md').text.contains("## ${releaseVersion} ")) {
            throw new GradleException("CHANGELOG.md has no ${releaseVersion} release heading")
        }

        def sourcesJar = tasks.named('sourcesJar').get().archiveFile.get().asFile
        def sourceEntries = zipTree(sourcesJar).files.collect { it.path.replace('\\', '/') }
        ['reverse-engineered', '.diagnostics', 'correct-chat.json'].each { forbidden ->
            if (sourceEntries.any { it.contains('/' + forbidden + '/') || it.endsWith('/' + forbidden) }) {
                throw new GradleException("Sources JAR must not contain ${forbidden}")
            }
        }
    }
}

tasks.register('printTarget') {
    doLast {
        println "Correct Chat target ${targetName}: Minecraft ${target.minecraft}, Fabric API ${target.fabricApi}, Mod Menu ${target.modMenu}, Java ${target.java}"
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyReleaseNotices')
}
